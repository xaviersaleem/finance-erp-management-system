services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: finance_erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    ports: ["5432:5432"]
    volumes: ["erpdata:/var/lib/postgresql/data"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://erp:erp@db:5432/finance_erp
    ports: ["8000:8000"]
    depends_on: [db]
  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  erpdata:
